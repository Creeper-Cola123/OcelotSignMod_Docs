    <script>
        // Gallery functionality for mod_optimization detail page
        document.addEventListener('DOMContentLoaded', function() {
            const galleryImages = [
                '../../../pic/plaza/mod_optimization/1/1.webp',
                '../../../pic/plaza/mod_optimization/1/2.webp',
                '../../../pic/plaza/mod_optimization/1/3.webp'
            ];
            let currentIndex = 0;

            const mainImage = document.getElementById('galleryMainImage');
            const mainWrap = document.getElementById('galleryMainWrap');
            const prevBtn = document.getElementById('galleryPrev');
            const nextBtn = document.getElementById('galleryNext');
            const thumbContainer = document.getElementById('galleryThumbnails');
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const lightboxCounter = document.getElementById('lightboxCounter');

            if (!mainImage || !lightbox) return;

            function showImage(idx) {
                if (idx < 0) idx = galleryImages.length - 1;
                if (idx >= galleryImages.length) idx = 0;
                currentIndex = idx;
                mainImage.src = galleryImages[idx];

                // Update thumbnails using event delegation target
                const thumbs = thumbContainer.querySelectorAll('.gallery-thumb');
                thumbs.forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === currentIndex);
                });

                // Scroll active thumbnail into view
                const activeThumb = thumbContainer.querySelector('.gallery-thumb.active');
                if (activeThumb && activeThumb.scrollIntoView) {
                    try {
                        activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    } catch (e) {
                        activeThumb.scrollIntoView();
                    }
                }
            }

            function openLightbox() {
                lightboxImage.src = galleryImages[currentIndex];
                lightboxCounter.textContent = (currentIndex + 1) + ' / ' + galleryImages.length;
                lightbox.classList.add('is-open');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.classList.add('lightbox-open');
            }

            function closeLightbox() {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('lightbox-open');
            }

            function lightboxShowImage(idx) {
                if (idx < 0) idx = galleryImages.length - 1;
                if (idx >= galleryImages.length) idx = 0;
                currentIndex = idx;
                lightboxImage.src = galleryImages[idx];
                lightboxCounter.textContent = (currentIndex + 1) + ' / ' + galleryImages.length;
                mainImage.src = galleryImages[idx];
                const thumbs = thumbContainer.querySelectorAll('.gallery-thumb');
                thumbs.forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === currentIndex);
                });
            }

            // Preview nav buttons
            if (prevBtn) {
                prevBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showImage(currentIndex - 1);
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showImage(currentIndex + 1);
                });
            }

            // Thumbnail click via event delegation
            thumbContainer.addEventListener('click', function(e) {
                const thumb = e.target.closest('.gallery-thumb');
                if (!thumb) return;
                e.preventDefault();
                const idx = parseInt(thumb.getAttribute('data-index'), 10);
                if (!isNaN(idx)) {
                    showImage(idx);
                }
            });

            // Click main image to open lightbox
            mainImage.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openLightbox();
            });

            // Lightbox controls
            lightboxClose.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                closeLightbox();
            });

            lightboxPrev.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                lightboxShowImage(currentIndex - 1);
            });

            lightboxNext.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                lightboxShowImage(currentIndex + 1);
            });

            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (!lightbox.classList.contains('is-open')) return;
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    lightboxShowImage(currentIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    lightboxShowImage(currentIndex + 1);
                }
            });
        });
    </script>
<script>
(function() {
  if (!('serviceWorker' in navigator)) return;

  function detectSwPath() {
    // 通过 components.js 的 src 推算站点根
    var scripts = document.getElementsByTagName('script');
    for (var i = 0; i < scripts.length; i++) {
      var src = scripts[i].src || '';
      if (src.indexOf('components.js') !== -1) {
        try {
          var u = new URL(src);
          var segs = u.pathname.split('/').filter(Boolean);
          segs.pop(); // components.js
          segs.pop(); // js
          return (segs.length === 0 ? '/' : '/' + segs.join('/') + '/') + 'sw.js';
        } catch (e) { /* fall through */ }
      }
    }
    return 'sw.js';
  }

  function register() {
    navigator.serviceWorker.register(detectSwPath()).then(function(reg) {
      // 定时检查更新（30 分钟），用户长时间停留时也能拉到新版
      setInterval(function() { reg.update().catch(function() {}); }, 30 * 60 * 1000);
      // 切回标签页时也检查一次
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) reg.update().catch(function() {});
      });
    }).catch(function(err) {
      console.warn('[SW] registration failed:', err);
    });
  }

  if (document.readyState === 'complete') {
    register();
  } else {
    window.addEventListener('load', register);
  }
})();
</script>
